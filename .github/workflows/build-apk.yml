name: Build Mascot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Export YOLOv8-Nano INT8 TFLite Model
        run: |
          pip install --quiet ultralytics tensorflow
          python -c "
          from ultralytics import YOLO
          import glob, shutil, os
          model = YOLO('yolov8n.pt')
          try:
              model.export(format='tflite', int8=True, imgsz=320)
          except Exception as e:
              print('Fallback export:', e)
              model.export(format='tflite', imgsz=320)
          os.makedirs('app/src/main/assets', exist_ok=True)
          files = sorted(glob.glob('yolov8n_saved_model/*.tflite'))
          print('Bundling model:', files[0])
          shutil.copy(files[0], 'app/src/main/assets/yolov8n.tflite')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mascot-custom-volume-lock
          path: app/build/outputs/apk/debug/*.apk
